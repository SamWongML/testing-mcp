# Local dev + integration-test dependencies (store · AWS adapters).
#
# Bring the services up, then point the integration tests at them:
#
# docker compose -f docker-compose.dev.yml up -d
# ATP_TEST_DATABASE_URL=postgresql://atp:atp@localhost:5432/atp \
# ATP_TEST_DYNAMO_ENDPOINT=http://localhost:8000 \
# ATP_TEST_S3_ENDPOINT=http://localhost:9000 \
# pnpm --filter @atp/store test
#
# Each suite gates on its own env var and `describe.skipIf`s out when it is unset, so
# `pnpm test` stays green with no services running. Dev itself needs only Postgres;
# dynamodb-local and MinIO exist to test the DynamoTaskStore / S3ArtifactStore
# adapters against real AWS-protocol servers rather than mocks.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: atp
      POSTGRES_PASSWORD: atp
      POSTGRES_DB: atp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atp -d atp"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - atp_pgdata:/var/lib/postgresql/data

  # Hot task state + idempotency. In-memory so each `up` starts clean; the tests
  # create their own throwaway tables per suite anyway.
  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "8000:8000"

  # S3-compatible artifact storage for the S3ArtifactStore suite, incl. presigned URLs.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: atp
      MINIO_ROOT_PASSWORD: atpsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  atp_pgdata:
